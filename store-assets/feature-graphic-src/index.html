<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: DMSans; src: url(DMSans-Regular.ttf); font-weight: 400; }
  @font-face { font-family: DMSans; src: url(DMSans-Bold.ttf); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: DMSans, sans-serif;
    color: #1A1208;
    background:
      radial-gradient(circle at 78% 50%, rgba(255,255,255,.75) 0, rgba(255,255,255,0) 340px),
      radial-gradient(circle at 0% 100%, rgba(156,129,120,.28) 0, rgba(156,129,120,0) 420px),
      linear-gradient(135deg, #F3EEE9 0%, #EFE6DF 55%, #E8DDD5 100%);
    position: relative;
  }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px;
          display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
  .brand img { width: 64px; height: 64px; border-radius: 16px;
               box-shadow: 0 8px 20px rgba(122,99,96,.35); }
  .brand span { font-size: 30px; font-weight: 700; color: #7A6360; letter-spacing: .3px; }
  h1 { font-size: 50px; line-height: 1.08; font-weight: 700; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #9C8178; }
  .chips { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .chip { font-size: 15px; font-weight: 700; color: #4A3D38;
          padding: 9px 14px; border-radius: 999px;
          background: rgba(255,255,255,.68); border: 1.5px solid rgba(255,255,255,.92);
          box-shadow: 0 4px 14px rgba(122,99,96,.14); }
  .art { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); }
  .tag { position: absolute; font-size: 15px; font-weight: 700; color: #4A3D38;
         padding: 9px 14px; border-radius: 14px;
         background: rgba(255,255,255,.82); border: 1.5px solid #fff;
         box-shadow: 0 8px 22px rgba(122,99,96,.2); display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2DBD7E; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><img src="logo.png" alt=""><span>M Optic</span></div>
    <h1>Find frames that<br><em>fit your face.</em></h1>
    <div class="chips">
      <div class="chip">AR Try-On</div>
      <div class="chip">Face Shape Scan</div>
      <div class="chip">Member Rewards</div>
    </div>
  </div>

  <svg class="art" width="420" height="380" viewBox="0 0 420 380" fill="none">
    <!-- scan frame corners -->
    <g stroke="#9C8178" stroke-width="6" stroke-linecap="round" opacity=".55">
      <path d="M40 90 V40 H90"/><path d="M330 40 H380 V90"/>
      <path d="M380 290 V340 H330"/><path d="M90 340 H40 V290"/>
    </g>
    <!-- scan line -->
    <rect x="60" y="232" width="300" height="3" rx="1.5" fill="#9C8178" opacity=".35"/>
    <!-- glasses -->
    <g stroke="#7A6360" stroke-width="10" stroke-linecap="round">
      <circle cx="132" cy="190" r="62" fill="rgba(255,255,255,.55)"/>
      <circle cx="288" cy="190" r="62" fill="rgba(255,255,255,.55)"/>
      <path d="M194 180 Q210 162 226 180"/>
      <path d="M70 178 L46 170"/><path d="M350 178 L374 170"/>
    </g>
    <!-- lens glints -->
    <g stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".95">
      <path d="M98 168 Q105 152 122 146"/><path d="M254 168 Q261 152 278 146"/>
    </g>
  </svg>
  <div class="tag" style="right:300px; top:118px;"><span class="dot"></span>Round face</div>
  <div class="tag" style="right:46px; bottom:64px;">★ 1,250 pts</div>
</body>
</html>
